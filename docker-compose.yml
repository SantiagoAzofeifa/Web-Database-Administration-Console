# Demo local de la Consola DBA:  docker compose up --build
# Luego abrir http://localhost:8080 e ingresar con admin / demo2026.
# Las credenciales son solo para esta demo local; en un servidor real se usan las de dba.conf.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: demo-root
      MARIADB_DATABASE: tienda
      MARIADB_USER: consola
      MARIADB_PASSWORD: demo-consola
    volumes:
      # Mismos scripts del proyecto, en orden: base de prueba, Módulo 03 y Módulo 04.
      - ./grupo3_novacloud/db/bd_prueba.sql:/docker-entrypoint-initdb.d/01_bd_prueba.sql:ro
      - ./grupo3_novacloud/db/diag_datos.sql:/docker-entrypoint-initdb.d/02_diag_datos.sql:ro
      - ./grupo3_novacloud/db/mant_datos.sql:/docker-entrypoint-initdb.d/03_mant_datos.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: tienda
      DB_USER: consola
      DB_PASS: demo-consola
      ADMIN_USER: admin
      ADMIN_PASSWORD: demo2026
    depends_on:
      db:
        condition: service_healthy
